<!DOCTYPE html>

<html lang="en-US">

    <head>

        <title> Login </title>

        <link rel="stylesheet" href= "C:\Users\HP\Desktop\AIUB\Summer 25-26\Web Tech\Mid\Lab Task 2\Design\design.css" >

        <script src="C:\Users\HP\Desktop\AIUB\Summer 25-26\Web Tech\Mid\Lab Task 2\Javascript\Script.js"> </script>

<body>

    <div class="header" >

        <h1> AIUB Student Portal Login </h1>
    </div>

    <div class = "container" >

    <h1> Login Form </h1>

    <form onsubmit="return Login()">

        <fieldset>

            <legend> Login Information </legend>

        <table>

            <tr>
                <td><label> Username: </label></td>
                <td><input type="text" id="username"></td>
                <td><p id="UsernameError"></p></td>
            </tr>

            <tr>
                <td><label> Password: </label></td>
                <td><input type="password" id="password"></td>
                <td><p id="PasswordError"></p></td>
            </tr>

            <tr>
                <td>
                    <input type="submit" value="Login"></td>
            </tr>

            <tr>
                <td colspan="3">
                    <p id="LoginMessage"></p>
                    
                </td>
            </tr>

        </table>

        </fieldset>

    </form>

    </div>


</body>
